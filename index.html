<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钓鱼人生 · Fish Player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ 顶栏 HUD ============ -->
  <header id="hud">
    <div class="hud-left">
      <div class="logo">🎣<span>钓鱼人生</span></div>
      <div class="stat" id="statCoin" title="金币">
        <span class="ico">💰</span><span class="val">0</span>
      </div>
      <div class="stat" id="statTime" title="累计游玩时长">
        <span class="ico">⏱</span><span class="val">0m</span>
      </div>
      <div class="stat" id="statBook" title="当前钓场图鉴进度">
        <span class="ico">📖</span><span class="val">0/0</span>
      </div>
    </div>
    <nav class="hud-right">
      <button class="tab" data-panel="fields"><span>🗺</span>钓场</button>
      <button class="tab" data-panel="book"><span>📖</span>图鉴</button>
      <button class="tab" data-panel="shop"><span>🛒</span>商店</button>
      <button class="tab" data-panel="net"><span>🎒</span>鱼护</button>
      <button class="tab" data-panel="stats"><span>📊</span>统计</button>
      <button class="tab" data-panel="settings"><span>⚙</span>设置</button>
    </nav>
  </header>

  <!-- ============ 舞台 ============ -->
  <main id="stage">
    <canvas id="scene"></canvas>

    <!-- 左上角当前钓场浮层 -->
    <div id="fieldBadge">
      <div class="fb-name">村口小池塘</div>
      <div class="fb-sub">D 级钓场</div>
    </div>

    <!-- 咬钩提示 -->
    <div id="biteHint" class="bite-hint hidden">
      <div class="bh-ring"></div>
      <div class="bh-text">咬钩了！点击收杆</div>
    </div>

    <!-- 拉扯小游戏覆盖层 -->
    <div id="fightUI" class="fight-ui hidden">
      <div class="fight-title">收 线 中</div>
      <div class="fight-bars">
        <div class="bar-row">
          <div class="bar-label">进度</div>
          <div class="bar-track"><div class="bar-fill prog" id="barProg"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label">张力</div>
          <div class="bar-track tension-track">
            <div class="zone-safe"></div>
            <div class="bar-fill tension" id="barTension"></div>
            <div class="danger-mark"></div>
          </div>
        </div>
      </div>
      <div class="fight-tip" id="fightTip">按住 <kbd>空格</kbd> 或 <kbd>鼠标左键</kbd> 收线，松开放线</div>
    </div>

    <!-- 挂机指示 -->
    <div id="idleChip" class="idle-chip hidden">挂机中</div>

    <!-- 渔获播报（挂机时也能看到钓到了什么） -->
    <div id="catchLog" class="catch-log" aria-live="polite"></div>

    <!-- 提示气泡 -->
    <div id="toasts" class="toasts"></div>
  </main>

  <!-- ============ 底栏操作区 ============ -->
  <footer id="deck">
    <div class="deck-left">
      <div class="slot" id="slotBait" data-role="bait">
        <div class="slot-label">鱼饵</div>
        <div class="slot-value">蚯蚓</div>
        <div class="slot-note">∞</div>
      </div>
      <div class="slot" id="slotRod" data-role="rod">
        <div class="slot-label">鱼竿</div>
        <div class="slot-value">竹制手竿</div>
        <div class="slot-note">稀有 +0%</div>
      </div>
      <div class="slot" id="slotLine" data-role="line">
        <div class="slot-label">鱼线</div>
        <div class="slot-value">2 号尼龙线</div>
        <div class="slot-note">张力上限 100</div>
      </div>
      <label class="idle-toggle" id="idleToggle">
        <input type="checkbox" id="chkIdle">
        <span class="switch"></span>
        <span class="idle-txt">挂机</span>
      </label>
    </div>
    <div class="deck-right">
      <button id="btnAction" class="btn-action">抛 竿</button>
    </div>
  </footer>

</div>

<!-- ============ 弹层容器 ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <header class="modal-head">
      <h2 id="modalTitle">标题</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ============ 结算卡片 ============ -->
<div id="catchCard" class="catch-card hidden">
  <canvas id="catchCanvas" width="360" height="200"></canvas>
  <div class="cc-info">
    <div class="cc-name" id="ccName">鲫鱼</div>
    <div class="cc-tags" id="ccTags"></div>
    <div class="cc-rows" id="ccRows"></div>
  </div>
  <div class="cc-actions">
    <button class="cc-btn ghost" id="ccKeep">收进鱼护</button>
    <button class="cc-btn" id="ccSell">卖 出</button>
  </div>
</div>

<!-- ============ 脚本（顺序加载，兼容 file:// 双击运行） ============ -->
<script src="src/data/config.js"></script>
<script src="src/data/fields.js"></script>
<script src="src/data/fish.js"></script>
<script src="src/data/items.js"></script>
<script src="src/core/util.js"></script>
<script src="src/core/platform.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/loot.js"></script>
<script src="src/core/state.js"></script>
<script src="src/render/fishart.js"></script>
<script src="src/render/scene.js"></script>
<script src="src/core/fight.js"></script>
<script src="src/core/fishing.js"></script>
<script src="src/ui/panels.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/devtools.js"></script>
<script src="src/main.js"></script>
</body>
</html>
