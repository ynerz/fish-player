<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>低多边形 3D · 全 9 种体型 × 3 档细节 · 出图验证台</title>
<style>
  :root{ --bg:#14171a; --panel:#1c2126; --line:#2b3238; --fg:#e8eef2; --dim:#8b98a3; --accent:#4ec3d9; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);padding:16px 18px 24px;
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-size:17px;font-weight:700}
  .sub{font-size:12px;color:var(--dim);line-height:1.7;margin:6px 0 12px;max-width:1000px}
  .sub b{color:var(--fg)}
  .sub code{background:#242b31;border-radius:4px;padding:1px 5px;font-size:11px;color:#9fd8e6}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  button{background:#242b31;color:var(--fg);border:1px solid var(--line);border-radius:7px;
         padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer}
  button.on{background:#16414d;border-color:#2b7d90;color:#a8e8f5}
  .stat{margin-left:auto;font-size:11.5px;color:var(--dim);text-align:right;line-height:1.6}
  .stat b{color:var(--accent);font-variant-numeric:tabular-nums}
  table{border-collapse:separate;border-spacing:6px;width:100%}
  th{background:#20262b;border:1px solid var(--line);border-radius:7px;padding:5px 8px;
     font-size:11.5px;font-weight:700;text-align:center;line-height:1.4}
  th.rowh{width:112px;text-align:left}
  th .n{display:block;font-size:10px;font-weight:400;color:var(--dim);margin-top:2px}
  td{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:#0d1013}
  canvas{display:block;width:100%;height:132px;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  .cap{font-size:10px;color:var(--dim);padding:2px 6px 4px;background:#161a1e;text-align:right}
</style>
</head>
<body>
<h1>低多边形 3D · 全 9 种体型 × 3 档细节</h1>
<div class="sub">
  <b>这不是示意稿，是加载真模块跑出来的</b> —— 本页只引 <code>src/render/mesh3d.js</code> 与
  <code>src/render/fishmesh.js</code>（没有任何内联的复制版），所以它就是那两个模块的可视验证台。<br>
  <b>列 = 细节层级</b>（0 普通/稀有 · 1 史诗 · 2 传说），映射由 <code>G.FishMesh.detailForRar()</code> 给出。<br>
  <b>传说（第 3 列）会动，前两列静态</b> —— 这条既是性能预算，也是「稀有的东西才配动」的稀有度表达。<br>
  <b>拖动任意一格可 360° 旋转</b>；松手 2 秒回正。上方按钮切换颜色档看材质。
</div>

<div class="bar">
  <button data-morph="normal" class="on">原色</button>
  <button data-morph="bright">亮色</button>
  <button data-morph="albino">白化</button>
  <button data-morph="golden">黄金</button>
  <button data-morph="shiny">闪光</button>
  <span style="width:14px"></span>
  <button data-mode="shapes" class="on">9 体型 × 3 细节</button>
  <button data-mode="fish">真实鱼（各自的配色）</button>
  <span class="stat" id="stat">加载中…</span>
</div>

<table id="tbl"></table>

<script src="../src/data/config.js"></script>
<script src="../src/data/fields.js"></script>
<script src="../src/data/fish.js"></script>
<script src="../src/render/mesh3d.js"></script>
<script src="../src/render/fishmesh.js"></script>
<script src="../src/render/fishpaint.js"></script>
<script>
(function () {
  'use strict';
  var M3 = window.G.Mesh3D, FM = window.G.FishMesh, FP = window.G.FishPaint;
  var SHAPES = ['fish', 'eel', 'ray', 'squid', 'jelly', 'oarfish', 'shark', 'whale', 'dragon'];
  var DETAILS = [
    { d: 0, name: '0 基础', note: '普通 / 稀有' },
    { d: 1, name: '1 史诗', note: '+腹鳍 +背棘' },
    { d: 2, name: '2 传说', note: '+飘带 +双层尾鳍' }
  ];
  /* 「体型」视图里每行给一组代表色（取自 gen-fish 的真实色板），
     真实鱼视图则直接用鱼自己的 body/accent */
  var SHAPE_TINT = {
    fish: ['#b9cbd6', '#8497a4'], eel: ['#5c7a68', '#33473d'], ray: ['#8fa2b0', '#5f7280'],
    squid: ['#c78f9e', '#8a5f75'], jelly: ['#cfe4ec', '#9dc2d2'], oarfish: ['#f2c14e', '#d99a1f'],
    shark: ['#6c7480', '#414a55'], whale: ['#9aa8b8', '#6b7888'], dragon: ['#c98f8f', '#8f5555']
  };
  var morphKey = 'normal';

  /* 颜色档不再自己写一份 —— 走 G.FishPaint（口径的单一来源） */

  var cells = [];
  var tbl = document.getElementById('tbl');
  var mode = 'shapes';        // 'shapes' = 9 体型 × 3 细节；'fish' = 真实鱼（各自的配色 + 细节档）
  var fishRows = null;

  /* 真实鱼取样：确定性抽样，跨钓场 / 跨稀有度 —— 证明「每种鱼都能出图」，
     而不是只挑好看的几条。每条鱼用它自己的 body/accent 配色。 */
  function pickRealFish() {
    var all = (window.G.FISH || []).slice();
    if (!all.length) return [];
    var byField = {};
    all.forEach(function (f) { (byField[f.field] = byField[f.field] || []).push(f); });
    var out = [];
    Object.keys(byField).forEach(function (fid) {
      var arr = byField[fid];
      // 每个钓场取 4 条，均匀铺开（含该场最稀有的一条）
      [0.0, 0.33, 0.66, 1.0].forEach(function (t) {
        out.push(arr[Math.min(arr.length - 1, Math.floor(t * (arr.length - 1)))]);
      });
    });
    return out.slice(0, 28);
  }

  function newCell(typeKey, detail, extra) {
    var mesh = FM.build(typeKey, { detail: detail });
    var dv = FM.defaultView(typeKey);
    var cell = {
      cv: null, ctx: null, cap: null,
      mesh: mesh, target: M3.makeTarget(mesh),
      yaw: dv.yaw, pitch: dv.pitch, defYaw: dv.yaw, defPitch: dv.pitch,
      dragging: false, lastX: 0, lastY: 0, releaseAt: 0,
      dirty: true, w: 0, h: 0, dpr: 1,
      camZ: 3, animate: detail >= 2, typeKey: typeKey,
      sparkles: [], time: Math.random() * 6,
      label: extra ? extra.label : '', sub: extra ? extra.sub : ''
    };
    for (var i = 0; i < mesh.verts.length; i += Math.max(2, Math.floor(mesh.verts.length / 16))) {
      if (mesh.verts[i].b > 0.25) {
        cell.sparkles.push({ i: i, ph: Math.random() * 6.28, f: 2.4 + Math.random() * 2.6 });
      }
    }
    return cell;
  }

  function wire(cell) {
    var cv = cell.cv;
    cv.addEventListener('pointerdown', function (e) {
      cell.dragging = true; cell.lastX = e.clientX; cell.lastY = e.clientY;
      cv.classList.add('drag');
      if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', function (e) {
      if (!cell.dragging) return;
      cell.yaw += (e.clientX - cell.lastX) * 0.010;
      cell.pitch = Math.max(-1.3, Math.min(1.3, cell.pitch + (e.clientY - cell.lastY) * 0.008));
      cell.lastX = e.clientX; cell.lastY = e.clientY;
      cell.releaseAt = 0; cell.dirty = true;
    });
    function up() {
      if (!cell.dragging) return;
      cell.dragging = false; cv.classList.remove('drag');
      cell.releaseAt = performance.now();
    }
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('lostpointercapture', up);
  }

  function addCell(tr, cell) {
    var td = document.createElement('td');
    var cv = document.createElement('canvas');
    td.appendChild(cv);
    var cap = document.createElement('div');
    cap.className = 'cap';
    td.appendChild(cap);
    tr.appendChild(td);
    cell.cv = cv; cell.ctx = cv.getContext('2d'); cell.cap = cap;
    cap.textContent = cell.capText || (cell.mesh.tris.length + ' 面');
    wire(cell);
    cells.push(cell);
  }

  function buildShapesView() {
    var tr = document.createElement('tr');
    var th0 = document.createElement('th');
    th0.className = 'rowh';
    th0.textContent = '体型 \\ 细节';
    tr.appendChild(th0);
    DETAILS.forEach(function (dd) {
      var th = document.createElement('th');
      th.innerHTML = dd.name + '<span class="n">' + dd.note + '</span>';
      tr.appendChild(th);
    });
    tbl.appendChild(tr);

    SHAPES.forEach(function (key) {
      var r = document.createElement('tr');
      var th = document.createElement('th');
      th.className = 'rowh';
      th.innerHTML = FM.TYPES[key].label + '<span class="n">' + key + '</span>';
      r.appendChild(th);
      DETAILS.forEach(function (dd) { addCell(r, newCell(key, dd.d)); });
      tbl.appendChild(r);
    });
  }

  function buildFishView() {
    var list = pickRealFish();
    if (!list.length) {
      tbl.innerHTML = '<tr><td style="padding:20px;color:#8b98a3">' +
        '没读到 G.FISH —— 这一页需要先加载 config.js / fields.js / fish.js</td></tr>';
      return;
    }
    var COLS = 7, i = 0;
    while (i < list.length) {
      var tr = document.createElement('tr');
      for (var c = 0; c < COLS && i < list.length; c++, i++) {
        var f = list[i];
        var det = FM.detailForRar(f.rar);
        var cell = newCell(f.shape, det, { label: f.name });
        cell.fish = f;
        cell.capText = f.name + '　' + ['普通', '稀有', '史诗', '传说'][f.rar] +
                       '　' + FM.TYPES[f.shape].label + '　' + cell.mesh.tris.length + ' 面';
        addCell(tr, cell);
      }
      tbl.appendChild(tr);
    }
  }

  function rebuild() {
    tbl.innerHTML = '';
    cells = [];
    if (mode === 'shapes') buildShapesView(); else buildFishView();
    resize();
    cells.forEach(function (c) { c.dirty = true; });
  }

  function resize() {
    cells.forEach(function (c) {
      var r = c.cv.getBoundingClientRect();
      c.dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.w = Math.round(r.width); c.h = Math.round(r.height);
      c.cv.width = Math.round(c.w * c.dpr);
      c.cv.height = Math.round(c.h * c.dpr);
      // 自动构图：按包围盒算出「主体占满画面 78%」的相机距离。
      // 之前固定 camZ = 3，长条鱼只占画面 24%，跟 v9 参考图的构图差很远。
      if (c.w && c.h) c.camZ = M3.fitCamera(c.mesh, c.w, c.h, 0.78);
      c.dirty = true;
    });
  }
  var last = 0, fps = 0, acc = 0, nf = 0, drawnFrames = 0;

  function drawCell(c, now) {
    if (!c.w) return;
    if (!c.dragging && c.releaseAt && now - c.releaseAt > 2000) {
      var k = Math.min(1, (now - c.releaseAt - 2000) / 900);
      var e = 1 - Math.pow(1 - k, 3);
      c.yaw += (c.defYaw - c.yaw) * e * 0.16;
      c.pitch += (c.defPitch - c.pitch) * e * 0.16;
      c.dirty = true;
      if (k >= 1 && Math.abs(c.yaw - c.defYaw) < 0.004 && Math.abs(c.pitch - c.defPitch) < 0.004) c.releaseAt = 0;
    }
    if (!c.dirty && !c.animate) return;      // 静态格只在脏时重画

    var ctx = c.ctx, W = c.w, H = c.h;
    ctx.setTransform(c.dpr, 0, 0, c.dpr, 0, 0);
    var g = ctx.createRadialGradient(W * 0.5, H * 0.45, 6, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#191d21'); g.addColorStop(1, '#0b0e11');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var tint = SHAPE_TINT[c.typeKey] || ['#8fa2b0', '#5f7280'];
    var pal = c.fish ? FP.fromFish(c.fish, morphKey) : FP.palette(tint[0], tint[1], morphKey);

    var vw = M3.view(W, H, c.yaw, c.pitch, c.camZ);
    M3.render(ctx, c.mesh, {
      target: c.target, view: vw, palette: pal,
      time: c.time, animate: c.animate
    });

    // 闪光档的星点（render 只管三角面，星点由调用方叠）
    if (FP.isSparkly(morphKey) && c.sparkles.length) {
      for (var i = 0; i < c.sparkles.length; i += 3) {
        var sp = c.sparkles[i];
        var tw = Math.sin(c.time * sp.f + sp.ph);
        if (tw < 0.35) continue;
        var p = c.target.proj[sp.i];
        var a = (tw - 0.35) / 0.65;
        var sz = 1.6 + 2.6 * a;
        var gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sz * 3.2);
        gg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * a) + ')');
        gg.addColorStop(0.35, 'rgba(190,235,255,' + (0.45 * a) + ')');
        gg.addColorStop(1, 'rgba(120,200,255,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(p.x, p.y, sz * 3.2, 0, 6.2832); ctx.fill();
      }
    }
    c.dirty = false;
    drawnFrames++;
  }

  function tick(now) {
    var dt = last ? now - last : 16; last = now;
    if (dt > 0 && dt < 250) { acc += 1000 / dt; nf++; }
    drawnFrames = 0;
    cells.forEach(function (c) { c.time += dt / 1000; drawCell(c, now); });
    if (nf >= 20) {
      fps = acc / nf; acc = 0; nf = 0;
      var tris = 0; cells.forEach(function (c) { tris += c.mesh.tris.length; });
      var live = cells.filter(function (c) { return c.animate; }).length;
      document.getElementById('stat').innerHTML =
        '帧率 <b>' + fps.toFixed(0) + '</b> fps · 本帧重画 <b>' + drawnFrames + '</b> 格<br>' +
        cells.length + ' 格共 <b>' + tris + '</b> 面 · <b>' + live + '</b> 格开动画 · 色档 <b>' +
        ({ normal: '原色', bright: '亮色', albino: '白化', golden: '黄金', shiny: '闪光' }[morphKey]) + '</b>';
    }
    requestAnimationFrame(tick);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-morph]'), function (b) {
    b.addEventListener('click', function () {
      morphKey = b.dataset.morph;
      Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-morph]'), function (x) {
        x.classList.toggle('on', x === b);
      });
      cells.forEach(function (c) { c.dirty = true; });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-mode]'), function (b) {
    b.addEventListener('click', function () {
      mode = b.dataset.mode;
      Array.prototype.forEach.call(document.querySelectorAll('.bar button[data-mode]'), function (x) {
        x.classList.toggle('on', x === b);
      });
      rebuild();
    });
  });

  rebuild();
  window.addEventListener('resize', resize);
  requestAnimationFrame(tick);

  window.__preview = {
    cells: function () { return cells; },
    setMorph: function (k) { morphKey = k; cells.forEach(function (c) { c.dirty = true; }); },
    setMode: function (m) { mode = m; rebuild(); },
    setYaw: function (i, y) { cells[i].yaw = y; cells[i].dirty = true; },
    fps: function () { return fps; },
    triCounts: function () { return cells.map(function (c) { return c.mesh.tris.length; }); },
    drawnFrames: function () { return drawnFrames; },
    cellCount: function () { return cells.length; },
    realFishCount: function () { return (window.G.FISH || []).length; }
  };
})();
</script>
</body>
</html>
