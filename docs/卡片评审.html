<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡片评审台 · 钓鱼人生</title>
<style>
  :root { --bg:#16171a; --card:#22242a; --line:#33363e; --fg:#e8e9ec; --dim:#9a9ea8;
          --ok:#3f9e6a; --bad:#c0503f; --accent:#5b8fd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:9; background:rgba(22,23,26,.96);
           border-bottom:1px solid var(--line); padding:10px 16px; }
  h1 { font-size:15px; font-weight:500; margin:0 0 6px; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .prog { flex:1; min-width:180px; height:6px; background:#2a2d34; border-radius:3px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--accent); width:0; }
  button { background:#2a2d34; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:#5a5f6b; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stat { color:var(--dim); }
  .stat b { color:var(--fg); font-weight:500; }
  .grid { display:grid; gap:14px; padding:16px;
          grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .c { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .c.ok  { border-color:var(--ok); }
  .c.bad { border-color:var(--bad); }
  .c > img { width:100%; display:block; background:#2b2b2e; aspect-ratio:3/2; object-fit:contain; }
  .morphs { display:flex; gap:3px; padding:3px 3px 0; }
  .morphs img { width:20%; aspect-ratio:3/2; object-fit:contain; background:#2b2b2e; border-radius:3px; }
  .m { padding:8px 10px 10px; }
  .nm { font-size:15px; font-weight:500; }
  .nm span { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
  .lat { color:var(--dim); font-size:12px; font-style:italic; min-height:18px; }
  details { margin:6px 0 0; }
  summary { color:var(--dim); font-size:12px; cursor:pointer; }
  details p { color:var(--dim); font-size:12px; margin:4px 0 0; }
  .acts { display:flex; gap:8px; margin-top:10px; }
  .acts button { flex:1; }
  .acts .b-ok.on  { background:var(--ok);  border-color:var(--ok);  color:#fff; }
  .acts .b-bad.on { background:var(--bad); border-color:var(--bad); color:#fff; }
  .acts .b-go { flex:0 0 auto; }
  .empty { padding:40px 16px; color:var(--dim); }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; max-width:640px; width:92%; }
  dialog textarea { width:100%; height:190px; background:#16171a; color:var(--fg);
                    border:1px solid var(--line); border-radius:6px; padding:8px;
                    font:12px/1.5 Consolas,monospace; }
  dialog h2 { font-size:14px; font-weight:500; margin:0 0 8px; }
  dialog p { color:var(--dim); font-size:12px; margin:8px 0; }
  code { background:#16171a; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>卡片评审台 —— 逐条看「画的到底是不是这个物种」</h1>
  <div class="bar">
    <span class="stat">进度 <b id="s-done">0</b>/<b id="s-all">0</b></span>
    <span class="prog"><i id="s-bar"></i></span>
    <span class="stat">合格 <b id="s-ok">0</b> · 重出 <b id="s-bad">0</b></span>
    <button id="f-all" class="on">全部</button>
    <button id="f-pend">未审</button>
    <button id="f-bad">重出</button>
    <button id="exp">导出重出清单</button>
    <button id="rst">清空</button>
    <span class="stat">快捷键：1=合格　2=重出</span>
  </div>
  <div class="stat" style="margin-top:4px">图片若显示不出来：请用「项目根目录起 http 服务」的方式打开本页（<code>python -m http.server 8765</code> → <code>127.0.0.1:8765/docs/卡片评审.html</code>）。</div>
</header>
<div class="grid" id="grid"></div>

<dialog id="dlg">
  <h2>重出清单</h2>
  <p>这些 id 需要重出。<b>必须连五档一起重出</b>（共 6 个文件），只重母版的话五档还停在旧形态。</p>
  <textarea id="out" readonly></textarea>
  <p id="cmds"></p>
  <div class="acts"><button id="cp">复制</button><button id="close">关闭</button></div>
</dialog>

shape":"fish","form":"a slightly depressed anterior body, a small superior mouth with a nearly vertical gape, thin lips, no barbels","fins":"a dorsal fin with soft unbranched rays and no spines, the dorsal fin origin slightly behind the pelvic fin origin, short small pectoral and pelvic fins, a forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D02","name":"白条","lat":"Hemiculter leucisculus","rar":0,"shape":"fish","form":"an elongated laterally compressed body, a slightly arched back, a small pointed head, an upward-directed mouth, no barbels, cycloid scales, a complete lateral line, a narrow caudal peduncle","fins":"a short dorsal fin with a spine, a deeply forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D03","name":"鲫鱼","lat":"Carassius auratus","rar":0,"shape":"fish","form":"a deep laterally compressed body, a slightly arched back, a small head, a short blunt snout, a terminal mouth, no barbels, cycloid scales, a complete lateral line","fins":"a long dorsal fin with a stout serrated spine, a deeply forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D04","name":"泥鳅","lat":"Misgurnus anguillicaudatus","rar":0,"shape":"eel","form":"an elongated body with a cylindrical anterior part and a laterally compressed posterior part, a pointed head, five pairs of barbels, small degenerate eyes","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D05","name":"鳑鲏","lat":"","rar":0,"shape":"fish","form":"a small body, a small mouth, no barbels at the corners of the mouth, an incomplete lateral line, no ventral keel, a short caudal peduncle","fins":"a forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D06","name":"食蚊鱼","lat":"Gambusia affinis","rar":0,"shape":"fish","form":"an elongated slightly compressed body, a short broad head, a flattened anterior head, a short snout, large eyes, a wide flat interorbital space, a small superior mouth with a horizontal gape, no barbels, cycloid scales on head and body, no lateral line, a broad long flattened caudal peduncle","fins":"small pectoral and pelvic fins, the pelvic fins set very close to the anal fin, a large dorsal fin, a large rounded tail fin, the third to fifth anal fin rays elongated into a rod-shaped gonopodium in males","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D07","name":"塘鳢","lat":"","rar":0,"shape":"fish","form":"an elongated stout body, a large broad flat head, a wide short snout, medium-sized scales, no lateral line","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D08","name":"小龙虾","lat":"Procambarus clarkii","rar":0,"shape":"squid","form":"a cylindrical body divided into a cephalothorax covered by a hard carapace and a segmented abdomen, a pair of large chelae on the first pair of legs, a fan-shaped tail","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D09","name":"黄颡鱼","lat":"Pelteobagrus fulvidraco","rar":1,"shape":"fish","form":"a large flat head, a short snout, a large inferior mouth, four pairs of barbels, naked skin with no scales, a complete lateral line","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"稀有"},{"id":"D10","name":"小鲤鱼","lat":"Cyprinus carpio","rar":1,"shape":"fish","form":"a deep laterally compressed body, a slightly arched back, a moderate-sized head, a short blunt snout, a terminal mouth, two pairs of barbels, cycloid scales, a complete lateral line","fins":"a long dorsal fin with a stout serrated spine, a deeply forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"稀有"},{"id":"D11","name":"黄鳝","lat":"Monopterus albus","rar":1,"shape":"eel","form":"an elongated cylindrical eel-like body, a short stout head, small eyes, a relatively large mouth, smooth scaleless skin, the left and right gill openings merged into a single V-shaped opening on the underside of the head","fins":"no pectoral or pelvic fins in adults, the dorsal and anal fins reduced to low skin folds","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"稀有"},{"id":"D12","name":"青虾虎","lat":"Ptereleotris heteroptera","rar":1,"shape":"fish","form":"an elongated oval body","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"稀有"},{"id":"D13","name":"金鲫","lat":"","rar":2,"shape":"fish","form":"a spindle-shaped body, a deep laterally compressed body, medium-sized scales, cycloid scales except on the head, a complete straight lateral line","fins":"pelvic fins set slightly ahead of the dorsal fin origin, pelvic fins similar in shape to the pectoral fins, a deeply forked tail fin with rounded lobe tips","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"史诗"},{"id":"D14","name":"老塘草鱼","lat":"Ctenopharyngodon idella","rar":2,"shape":"fish","form":"an elongated body, an almost cylindrical anterior part, a laterally compressed tail region, a rounded belly, no ventral keel, a broad medium-sized head, a slightly flattened anterior head, a short blunt snout, medium-sized cycloid scales, a lateral line curved anteriorly and straight posteriorly","fins":"","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"史诗"},{"id":"D15","name":"圆尾斗鱼","lat":"Macropodus ocellatus","rar":0,"shape":"fish","form":"a body covered with scales, cycloid scales on the head, ctenoid scales on the flanks","fins":"long large dorsal and anal fins, pelvic fins set below the pectoral region, a rounded tail fin; in mature males the posterior rays of the dorsal and anal fins are longer","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"D16","name":"塘主的大青鱼","lat":"Mylopharyngodon piceus","rar":3,"shape":"fish","form":"an elongated body, a slightly compressed body, a rounded belly, no ventral keel, a broad blunt head, a terminal mouth, no barbels, large cycloid scales, a complete lateral line","fins":"a long dorsal fin with no spines, a forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"传说"},{"id":"S01","name":"深海鳕","lat":"","rar":0,"shape":"fish","form":"an elongated body tapering to a slim tail stock, a large head, a blunt snout, a small barbel under the chin, small cycloid scales","fins":"three separate dorsal fins, two anal fins, a slightly forked tail fin","morphs":["normal","bright","albino","golden","shiny"],"rarCn":"普通"},{"id":"S02","name":"灯笼鱼","lat":"","rar":0,"shape":"fish","form":"a slender elongated body, a large head, a large eye, a terminal mouth, cycloid scales, a complete lateral line","fins":"a dorsal fin, a small adipose fin, a forked tail fin","morphs":["normal","bright","albino","golden"],"rarCn":"普通"}];
var KEY = 'fishcard-review-v1';
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
var filter = 'all';

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function render() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  var shown = 0;
  DATA.forEach(function (d) {
    var st = state[d.id] || '';
    if (filter === 'pending' && st) return;
    if (filter === 'bad' && st !== 'bad') return;
    shown++;
    var el = document.createElement('div');
    el.className = 'c' + (st ? ' ' + st : '');
    el.setAttribute('data-id', d.id);
    var h = '<img src="../assets/cards/' + d.id + '.png" loading="lazy">';
    if (d.morphs.length) {
      h += '<div class="morphs">';
      d.morphs.forEach(function (m) {
        h += '<img src="../assets/cards/' + d.id + '-' + m + '.png" loading="lazy" title="' + m + '">';
      });
      h += '</div>';
    }
    h += '<div class="m"><div class="nm">' + d.name +
         '<span>' + d.id + ' · ' + d.rarCn + ' · ' + d.shape + '</span></div>' +
         '<div class="lat">' + (d.lat || '') + '</div>';
    if (d.form || d.fins) {
      h += '<details><summary>形态描述（提示词里用的）</summary><p>' +
           (d.form || '') + (d.fins ? '<br>' + d.fins : '') + '</p></details>';
    }
    h += '<div class="acts">' +
         '<button class="b-ok' + (st === 'ok' ? ' on' : '') + '" data-id="' + d.id + '" data-v="ok">合格</button>' +
         '<button class="b-bad' + (st === 'bad' ? ' on' : '') + '" data-id="' + d.id + '" data-v="bad">重出</button>' +
         '<button class="b-go" data-go="' + d.name + '">对照百科</button>' +
         '</div></div>';
    el.innerHTML = h;
    g.appendChild(el);
  });
  if (!shown) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '这个筛选下没有卡片。';
    g.appendChild(e);
  }
  updateStats();
}

function updateStats() {
  var done = 0, ok = 0, bad = 0;
  DATA.forEach(function (d) {
    if (state[d.id]) { done++; if (state[d.id] === 'ok') ok++; else bad++; }
  });
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-all').textContent = DATA.length;
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-bad').textContent = bad;
  document.getElementById('s-bar').style.width = (DATA.length ? done * 100 / DATA.length : 0) + '%';
}

/* 只改这一张卡 —— **不要整页重绘**：122 张图重新建元素会全部重新解码、屏幕闪一下，
   而且滚动位置也会跳。筛选/清空才走 render()。 */
function paintCard(id) {
  var el = document.querySelector('.c[data-id="' + id + '"]');
  if (!el) return;
  var st = state[id] || '';
  el.className = 'c' + (st ? ' ' + st : '');
  el.querySelector('.b-ok').classList.toggle('on', st === 'ok');
  el.querySelector('.b-bad').classList.toggle('on', st === 'bad');
}

document.getElementById('grid').addEventListener('click', function (ev) {
  var b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.go) {
    window.open('https://www.bing.com/search?q=' + encodeURIComponent(b.dataset.go + ' 鱼 形态特征'), '_blank');
    return;
  }
  var id = b.dataset.id, v = b.dataset.v;
  if (!id) return;
  state[id] = (state[id] === v) ? '' : v;
  if (!state[id]) delete state[id];
  save(); paintCard(id); updateStats();
});

['all', 'pend', 'bad'].forEach(function (k) {
  var idmap = { all: 'f-all', pend: 'f-pend', bad: 'f-bad' };
  document.getElementById(idmap[k]).onclick = function () {
    filter = k === 'all' ? 'all' : (k === 'pend' ? 'pending' : 'bad');
    ['f-all', 'f-pend', 'f-bad'].forEach(function (x) {
      document.getElementById(x).classList.toggle('on', x === idmap[k]);
    });
    render();
  };
});

document.getElementById('rst').onclick = function () {
  if (confirm('清空全部评审记录？')) { state = {}; save(); render(); }
};

document.getElementById('exp').onclick = function () {
  var bad = [], ok = [], pend = [];
  DATA.forEach(function (d) {
    if (state[d.id] === 'bad') bad.push(d.id);
    else if (state[d.id] === 'ok') ok.push(d.id);
    else pend.push(d.id);
  });
  var L = [];
  L.push('# 重出清单（' + bad.length + ' 条）');
  L.push('# 每条必须重出 6 个文件：<id>.png + <id>-normal/bright/albino/golden/shiny.png');
  L.push('# 步骤：① 先备份并移走这 6 个文件  ② 跑下面这条命令');
  L.push('');
  L.push('IDS=' + bad.join(','));
  L.push('');
  L.push('python tools/gen-art.py --list ' + bad.join(','));
  L.push('');
  L.push('# 未审 ' + pend.length + ' 条 / 已合格 ' + ok.length + ' 条');
  document.getElementById('out').value = bad.length ? L.join('\n') : '（还没有标记为「重出」的）';
  document.getElementById('cmds').innerHTML = bad.length
    ? '把上面 <code>--list</code> 那行发给助手即可。'
    : '';
  document.getElementById('dlg').showModal();
};

document.getElementById('close').onclick = function () { document.getElementById('dlg').close(); };
document.getElementById('cp').onclick = function () {
  var t = document.getElementById('out');
  t.select(); document.execCommand('copy');
};

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1' || e.key === 'y') { var b = document.querySelector('.b-ok:not(.on)'); if (b) b.click(); }
  if (e.key === '2' || e.key === 'n') { var c = document.querySelector('.b-bad:not(.on)'); if (c) c.click(); }
});

DATA.forEach(function (d) { d.rarCn = d.rarCn || ''; });
render();
</script>
</body>
</html>
